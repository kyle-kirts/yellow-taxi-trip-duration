[project]
name = "yellow-taxi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyle Kirts", email = "128338807+kyle-kirts@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pyspark==4.1.1",
]

[project.scripts]
taxi-prepare = "yellow_taxi.jobs.prepare:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
geo = [
    "pyshp>=3.1.6",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
# PySpark probes for ipykernel; the lab PYTHONPATH exposes a system jupyter_core that warns on import.
filterwarnings = ["ignore:Jupyter is migrating its paths:DeprecationWarning"]
